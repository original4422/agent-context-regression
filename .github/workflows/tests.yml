name: Tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: acr list
      - run: acr plan --codex /missing/codex
      - run: acr run --dry-run --suite all --codex /missing/codex
      - run: acr native-plan
      - run: acr native-plan --scenario policy-revision
        working-directory: ${{ runner.temp }}
      - run: acr native-accept "${{ github.workspace }}/reports/native-smoke.json" --scenario fixed-policy
        working-directory: ${{ runner.temp }}
      - run: acr native-accept "${{ github.workspace }}/reports/native-revision.json" --scenario policy-revision
        working-directory: ${{ runner.temp }}
      - run: python -I -B scripts/recheck_native_candidates.py
      - run: python -I -B scripts/recheck_native_candidates.py --scenario policy-revision
